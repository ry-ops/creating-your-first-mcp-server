<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Creating your first MCP server: give Claude your own tools</title>
  <desc id="d">Claude connects to your MCP server over the Model Context Protocol. The server advertises tools — calculator, file-ops, weather. Claude calls the weather tool and gets the answer back. A TypeScript tutorial for building MCP servers.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#d97757"/><stop offset=".5" stop-color="#b58cff"/><stop offset="1" stop-color="#3ddc84"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes ask { 0%,3.00% { opacity:0; transform:translateY(8px); } 6.50%,94.00% { opacity:1; transform:translateY(0); } 97.00%,100% { opacity:0 } } .ask { animation:ask 10.0s infinite; }
    @keyframes ans { 0%,64.00% { opacity:0; transform:translateY(8px); } 67.50%,94.00% { opacity:1; transform:translateY(0); } 97.00%,100% { opacity:0 } } .ans { animation:ans 10.0s infinite; }
    @keyframes toolflash { 0%,32.00% { opacity:0; } 35.50%,47.00% { opacity:1; } 50.00%,100% { opacity:0 } } .toolflash { animation:toolflash 10.0s infinite; }
    @keyframes rq { 0%,16.00% { offset-distance:0%; opacity:0 } 17.00% {opacity:1} 28.00% { offset-distance:100%; opacity:1 } 30.00%,100% {opacity:0} } .rq { animation:rq 10.0s infinite; offset-path: path('M320 230 L 520 230'); }
    @keyframes rp { 0%,50.00% { offset-distance:0%; opacity:0 } 51.00% {opacity:1} 62.00% { offset-distance:100%; opacity:1 } 64.00%,100% {opacity:0} } .rp { animation:rp 10.0s infinite; offset-path: path('M520 260 L 320 260'); }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="400" rx="20" fill="#0f1420"/>
  <text x="40" y="58" font-size="34" font-weight="800" style="fill:url(#title)">Your first MCP server</text>
  <text x="42" y="88" font-size="16" class="muted">Extend Claude with your own tools — it discovers and calls them over the Model Context Protocol.</text>

  <!-- client -->
  <rect x="40" y="150" width="200" height="160" rx="12" fill="#161d2b" stroke="#2c3750"/>
  <text x="140" y="180" text-anchor="middle" font-size="15" font-weight="800">Claude</text>
  <text x="140" y="200" text-anchor="middle" font-size="11" class="muted">(MCP client)</text>
  <g class="ask"><rect x="56" y="216" width="168" height="34" rx="8" fill="#2a3550"/><text x="64" y="238" font-size="11">"weather in Tokyo?"</text></g>
  <g class="ans"><rect x="56" y="262" width="168" height="34" rx="8" fill="#13233a"/><text x="64" y="284" font-size="11" style="fill:#a8e4ff">"18°C, light rain"</text></g>

  <!-- transport -->
  <line x1="240" y1="230" x2="520" y2="230" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <line x1="240" y1="260" x2="520" y2="260" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="380" y="222" text-anchor="middle" font-size="10" class="mono muted">MCP · list + call tools</text>
  <circle class="rq" r="5" fill="#b58cff"/><circle class="rp" r="5" fill="#3ddc84"/>

  <!-- server -->
  <rect x="520" y="150" width="400" height="160" rx="12" fill="#1d2536" stroke="#d97757" stroke-width="2"/>
  <text x="540" y="180" font-size="14" font-weight="800">your MCP server</text>
  <text x="864" y="180" text-anchor="end" font-size="10" class="muted">TypeScript</text>
  <rect x="580" y="200" width="300" height="30" rx="8" fill="#ffb02e" fill-opacity="0.08" stroke="#ffb02e" stroke-opacity="0.5"/><text x="596" y="222" font-size="12.5" class="mono" style="fill:#ffb02e">calculator</text><rect x="580" y="236" width="300" height="30" rx="8" fill="#3ec7ff" fill-opacity="0.08" stroke="#3ec7ff" stroke-opacity="0.5"/><text x="596" y="258" font-size="12.5" class="mono" style="fill:#3ec7ff">file-ops</text><rect x="580" y="272" width="300" height="30" rx="8" fill="#3ddc84" fill-opacity="0.2" stroke="#3ddc84" stroke-opacity="1"/><text x="596" y="294" font-size="12.5" class="mono" style="fill:#3ddc84">weather</text><text x="864" y="294" text-anchor="end" font-size="10" class="muted">called ↑</text>
</svg>
