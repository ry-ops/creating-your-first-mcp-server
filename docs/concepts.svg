<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">The MCP building blocks</title>
  <desc id="d">A client connects to an MCP server, which exposes three kinds of capability: tools (functions like calculator, file-ops, weather), resources (structured data by URI such as files, db records and API endpoints), and prompts (reusable parameterized templates).</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes g0 { 0%,12.00% { opacity:0; transform:translateY(8px); } 16.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g0 { animation:g0 10.0s infinite; }
    @keyframes g1 { 0%,16.00% { opacity:0; transform:translateY(8px); } 20.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g1 { animation:g1 10.0s infinite; }
    @keyframes g2 { 0%,20.00% { opacity:0; transform:translateY(8px); } 24.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g2 { animation:g2 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="420" rx="20" fill="#0f1420"/>
  <text x="40" y="54" font-size="27" font-weight="800">The building blocks</text>
  <text x="40" y="80" font-size="14" class="muted">A client connects to your server; your server exposes three kinds of capability.</text>
  <rect x="40" y="120" width="180" height="56" rx="10" fill="#161d2b" stroke="#2c3750"/><text x="130" y="145" text-anchor="middle" font-size="13" font-weight="700">Client</text><text x="130" y="163" text-anchor="middle" font-size="10.5" class="muted">Claude, an app…</text>
  <line x1="220" y1="148" x2="360" y2="148" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="290" y="140" text-anchor="middle" font-size="10" class="mono muted">MCP</text>
  <rect x="360" y="120" width="320" height="56" rx="10" fill="#1d2536" stroke="#d97757" stroke-width="2"/><text x="520" y="145" text-anchor="middle" font-size="13" font-weight="700">Server (yours)</text><text x="520" y="163" text-anchor="middle" font-size="10.5" class="muted">exposes the three below</text>
  <g class="g0"><rect x="40" y="230" width="260" height="150" rx="12" fill="#ffb02e" fill-opacity=".08" stroke="#ffb02e" stroke-opacity=".55"/><text x="58" y="262" font-size="16" font-weight="700">Tools</text><text x="58" y="282" font-size="11" class="muted">functions Claude can call</text><text x="58" y="300" font-size="11.5" class="mono" style="fill:#ffb02e">calculator</text><text x="58" y="320" font-size="11.5" class="mono" style="fill:#ffb02e">file-ops</text><text x="58" y="340" font-size="11.5" class="mono" style="fill:#ffb02e">weather</text></g><g class="g1"><rect x="350" y="230" width="260" height="150" rx="12" fill="#3ec7ff" fill-opacity=".08" stroke="#3ec7ff" stroke-opacity=".55"/><text x="368" y="262" font-size="16" font-weight="700">Resources</text><text x="368" y="282" font-size="11" class="muted">structured data by URI</text><text x="368" y="300" font-size="11.5" class="mono" style="fill:#3ec7ff">files</text><text x="368" y="320" font-size="11.5" class="mono" style="fill:#3ec7ff">db records</text><text x="368" y="340" font-size="11.5" class="mono" style="fill:#3ec7ff">API endpoints</text></g><g class="g2"><rect x="660" y="230" width="260" height="150" rx="12" fill="#b58cff" fill-opacity=".08" stroke="#b58cff" stroke-opacity=".55"/><text x="678" y="262" font-size="16" font-weight="700">Prompts</text><text x="678" y="282" font-size="11" class="muted">reusable templates</text><text x="678" y="300" font-size="11.5" class="mono" style="fill:#b58cff">parameterized</text><text x="678" y="320" font-size="11.5" class="mono" style="fill:#b58cff">common tasks</text></g>
</svg>
